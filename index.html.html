<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hitos de la Literatura Universal</title>
    <meta name="description" content="Un viaje interactivo por las obras, las ideas y las voces que transformaron la historia de la literatura.">
    
    <!-- Fuentes Google Fonts: Playfair Display (Serif) e Inter (Sans-serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (CDN para utilidades estructurales) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons (CDN) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Variables CSS para los temas y estética editorial */
        :root {
            /* Tema Claro (Marfil / Papel antiguo) */
            --bg-body: #F7F2E8;
            --text-main: #29251F;
            --text-muted: #5C5547;
            --accent: #9B3922; /* Terracota */
            --accent-hover: #7A2C1A;
            --card-bg: #FFFDF9;
            --border-color: #E6DFD1;
            --line-color: #D3C9B5;
            --overlay-bg: rgba(41, 37, 31, 0.5);
            --shadow-color: rgba(41, 37, 31, 0.08);
        }

        [data-theme="dark"] {
            /* Tema Oscuro (Azul noche / Carbón) */
            --bg-body: #0F1319;
            --text-main: #F0EAD6; /* Marfil claro */
            --text-muted: #A39B8A;
            --accent: #C28E5C; /* Cobre / Dorado envejecido */
            --accent-hover: #E0A973;
            --card-bg: #1A1F26;
            --border-color: #2A333E;
            --line-color: #3A4553;
            --overlay-bg: rgba(0, 0, 0, 0.75);
            --shadow-color: rgba(0, 0, 0, 0.3);
        }

        /* Estilos base */
        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            transition: background-color 0.4s ease, color 0.4s ease;
            overflow-x: hidden;
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1, h2, h3, h4, .font-serif {
            font-family: 'Playfair Display', serif;
        }

        /* Utilidades vinculadas a variables */
        .bg-theme { background-color: var(--bg-body); }
        .text-theme { color: var(--text-main); }
        .text-muted { color: var(--text-muted); }
        .text-accent { color: var(--accent); }
        .bg-card { background-color: var(--card-bg); }
        .border-theme { border-color: var(--border-color); }
        .shadow-editorial { box-shadow: 0 10px 30px var(--shadow-color); }

        /* Contenedor principal de scroll */
        .timeline-scroll-wrapper {
            width: 100%;
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) var(--border-color);
            padding: 2rem 0 6rem 0;
            scroll-behavior: smooth;
        }

        .timeline-scroll-wrapper::-webkit-scrollbar {
            height: 6px;
        }
        .timeline-scroll-wrapper::-webkit-scrollbar-track {
            background: var(--border-color);
            border-radius: 4px;
        }
        .timeline-scroll-wrapper::-webkit-scrollbar-thumb {
            background-color: var(--accent);
            border-radius: 4px;
        }

        /* Track de la línea (Escritorio - Horizontal) */
        .timeline-track {
            position: relative;
            display: flex;
            align-items: center;
            min-width: max-content;
            padding: 0 4vw;
            height: 350px; 
        }

        /* Línea central */
        .timeline-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background-color: var(--line-color);
            transform: translateY(-50%);
            z-index: 0;
        }

        /* Item de la línea del tiempo */
        .timeline-item {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 200px;
        }

        /* Marcador (Botón interactivo) */
        .timeline-marker {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--card-bg);
            border: 2px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 0 4px var(--bg-body);
        }

        .timeline-marker:hover, .timeline-marker:focus-visible {
            background-color: var(--accent);
            color: var(--bg-body);
            transform: scale(1.15);
            outline: none;
        }
        
        .timeline-marker.active {
            background-color: var(--accent);
            color: var(--bg-body);
            box-shadow: 0 0 0 6px var(--border-color);
        }

        /* Tarjeta de información en la línea (Escritorio) */
        .timeline-content {
            position: absolute;
            width: 220px;
            text-align: center;
            padding: 1rem;
            opacity: 0.9;
            transition: all 0.3s ease;
        }

        .timeline-item:hover .timeline-content {
            opacity: 1;
            transform: translateY(-2px);
        }

        /* Alternancia arriba/abajo para escritorio */
        .timeline-item:nth-child(odd) .timeline-content {
            bottom: 100%;
            margin-bottom: 24px;
        }
        
        .timeline-item:nth-child(even) .timeline-content {
            top: 100%;
            margin-top: 24px;
        }

        /* Decorador conector */
        .timeline-item::after {
            content: '';
            position: absolute;
            width: 2px;
            height: 24px;
            background-color: var(--line-color);
            z-index: -1;
        }
        .timeline-item:nth-child(odd)::after { bottom: 50%; }
        .timeline-item:nth-child(even)::after { top: 50%; }

        @media (max-width: 768px) {
            .timeline-scroll-wrapper {
                padding: 1rem 1rem 4rem 1rem;
                overflow-x: hidden;
            }
            .timeline-track {
                flex-direction: column;
                height: auto;
                min-width: 100%;
                padding: 2rem 0;
                align-items: flex-start;
            }
            .timeline-line {
                top: 0;
                bottom: 0;
                left: 35px; /* Alinear con el centro del marcador */
                width: 2px;
                height: 100%;
                right: auto;
                transform: none;
            }
            .timeline-item {
                width: 100%;
                flex-direction: row;
                margin-bottom: 3rem;
                padding-left: 20px;
            }
            .timeline-item:last-child {
                margin-bottom: 0;
            }
            .timeline-marker {
                flex-shrink: 0;
            }
            .timeline-content {
                position: static;
                text-align: left;
                width: auto;
                margin: 0 0 0 1.5rem !important;
                padding: 0;
            }
            .timeline-item::after {
                display: none; /* Ocultar conector en móvil */
            }
        }

        /* Configuración Dropdown */
        .settings-dropdown {
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.2s ease;
        }
        .settings-dropdown.show {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background-color: var(--overlay-bg);
            backdrop-filter: blur(3px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            padding: 1rem;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.95) translateY(10px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }
        .modal-overlay.active .modal-container {
            transform: scale(1) translateY(0);
        }

        /* Botones generales */
        .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            border-radius: 0.375rem;
            color: var(--text-main);
            transition: background-color 0.2s;
        }
        .btn-icon:hover, .btn-icon:focus-visible {
            background-color: var(--border-color);
            outline: none;
        }

        /* Accesibilidad: Reducción de movimiento */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    
    <!-- Encabezado -->
    <header class="relative pt-12 pb-8 px-6 sm:px-12 border-b border-theme flex-shrink-0">
        <div class="max-w-6xl mx-auto flex flex-col items-center text-center relative">
            
            <!-- Botón Configuración -->
            <div class="absolute top-0 right-0 sm:top-2 sm:right-2">
                <button id="btn-settings" class="btn-icon gap-2 text-sm font-medium" aria-haspopup="true" aria-expanded="false" aria-label="Abrir configuración">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                    <span class="hidden sm:inline">Configuración</span>
                </button>
                
                <!-- Panel de configuración -->
                <div id="settings-panel" class="settings-dropdown absolute right-0 mt-2 w-48 bg-card border border-theme shadow-editorial rounded-md p-3 z-50 text-left">
                    <h3 class="text-xs font-semibold text-muted uppercase tracking-wider mb-3">Apariencia</h3>
                    <div class="space-y-2">
                        <button class="theme-toggle-btn w-full flex items-center justify-between px-3 py-2 text-sm rounded hover:bg-[var(--border-color)] transition-colors text-theme" data-set-theme="light" aria-pressed="true">
                            <span class="flex items-center gap-2"><i data-lucide="sun" class="w-4 h-4"></i> Modo claro</span>
                            <i data-lucide="check" class="w-4 h-4 text-accent opacity-0 check-icon"></i>
                        </button>
                        <button class="theme-toggle-btn w-full flex items-center justify-between px-3 py-2 text-sm rounded hover:bg-[var(--border-color)] transition-colors text-theme" data-set-theme="dark" aria-pressed="false">
                            <span class="flex items-center gap-2"><i data-lucide="moon" class="w-4 h-4"></i> Modo oscuro</span>
                            <i data-lucide="check" class="w-4 h-4 text-accent opacity-0 check-icon"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Título y descripción -->
            <span class="text-accent text-xs font-bold tracking-[0.2em] uppercase mb-4 flex items-center gap-2">
                <i data-lucide="book-open" class="w-4 h-4"></i>
                Atlas Literario
            </span>
            <h1 class="font-serif text-4xl sm:text-5xl md:text-6xl font-bold mb-4 text-theme leading-tight">
                Hitos de la<br>Literatura Universal
            </h1>
            <p class="text-muted max-w-2xl text-base sm:text-lg mb-6 leading-relaxed">
                Un viaje interactivo por las obras, las ideas y las voces que transformaron la historia de la literatura.
            </p>
            <div class="inline-flex items-center gap-2 px-4 py-2 bg-card border border-theme rounded-full text-sm text-theme shadow-sm">
                <i data-lucide="mouse-pointer-click" class="w-4 h-4 text-accent"></i>
                Selecciona un hito para descubrir su historia
            </div>
        </div>
    </header>

    <!-- Área Principal: Línea del Tiempo -->
    <main class="flex-grow flex flex-col justify-center relative overflow-hidden" aria-label="Línea del tiempo interactiva">
        <div class="timeline-scroll-wrapper" id="timeline-container" tabindex="0" aria-label="Desplazar línea del tiempo">
            <div class="timeline-track" id="timeline-track" role="list">
                <div class="timeline-line" aria-hidden="true"></div>
                <!-- Los marcadores se generarán dinámicamente mediante JavaScript -->
            </div>
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="py-6 text-center border-t border-theme flex-shrink-0 mt-auto">
        <p class="text-sm font-serif italic text-muted">
            Créditos: Karla Loranca Viveros · 2026
        </p>
    </footer>

    <!-- Modal de Información -->
    <div id="milestone-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true">
        <div class="modal-container shadow-editorial rounded-lg flex flex-col" id="modal-content-wrapper">
            
            <!-- Cabecera del modal -->
            <div class="flex items-center justify-between p-4 border-b border-theme">
                <span class="text-xs font-medium text-muted tracking-widest uppercase" id="modal-counter">Hito 1 de 13</span>
                <button id="btn-close-modal" class="btn-icon" aria-label="Cerrar ventana">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Cuerpo del modal -->
            <div class="p-6 sm:p-10 flex-grow relative">
                <!-- Icono decorativo -->
                <div class="absolute top-6 right-6 sm:top-10 sm:right-10 opacity-10 pointer-events-none" aria-hidden="true">
                    <i data-lucide="feather" class="w-24 h-24 text-accent"></i>
                </div>
                
                <div class="relative z-10">
                    <span id="modal-period" class="inline-block text-accent font-semibold text-sm mb-2 border border-accent/30 rounded-full px-3 py-1 bg-accent/5">
                        <!-- Periodo (JS) -->
                    </span>
                    <h2 id="modal-title" class="font-serif text-3xl sm:text-4xl font-bold mb-6 text-theme leading-tight">
                        <!-- Título (JS) -->
                    </h2>
                    
                    <div id="modal-description" class="prose prose-theme max-w-none text-theme leading-relaxed space-y-4 text-base sm:text-lg">
                        <!-- Descripción (JS) -->
                    </div>
                </div>
            </div>

            <!-- Pie del modal / Navegación -->
            <div class="p-4 sm:p-6 border-t border-theme bg-[var(--bg-body)] flex items-center justify-between rounded-b-lg">
                <button id="btn-prev" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-theme hover:text-accent transition-colors disabled:opacity-30 disabled:cursor-not-allowed" aria-label="Hito anterior">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                    Anterior
                </button>
                <div class="w-16 h-1 bg-card rounded overflow-hidden" aria-hidden="true">
                    <div id="modal-progress-bar" class="h-full bg-accent transition-all duration-300 w-0"></div>
                </div>
                <button id="btn-next" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-theme hover:text-accent transition-colors disabled:opacity-30 disabled:cursor-not-allowed" aria-label="Hito siguiente">
                    Siguiente
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        // 1. DATOS OBLIGATORIOS (Extraídos exactamente del documento)
        const hitos = [
            {
                id: 1,
                title: "Invención de la escritura y primeras epopeyas",
                period: "c. 3000 – 2000 a. C.",
                description: "Transición de la tradición oral a la escrita.\nDestaca el Poema de Gilgamesh (Mesopotamia), considerado la obra literaria más antigua conservada."
            },
            {
                id: 2,
                title: "Grandes épicas de la India",
                period: "s. VIII – IV a. C.",
                description: "Desarrollo fundamental de la literatura sánscrita con hondo impacto filosófico.\nObras clave: El Mahabharata y el Ramayana."
            },
            {
                id: 3,
                title: "Grecia Clásica y la consolidación de los géneros",
                period: "s. VIII – IV a. C.",
                description: "Nace la épica, el teatro (tragedia y comedia) y la lírica occidental.\nObras clave: La Ilíada y la Odisea de Homero; tragedias de Sófocles y Eurípides."
            },
            {
                id: 4,
                title: "Edad de Oro Islámica y la narrativa oriental",
                period: "s. VIII – XIV",
                description: "Florecimiento de la poesía sufí y la estructura del relato dentro del relato.\nObra clave: Las mil y una noches (compilación de relatos árabes, persas e indios)."
            },
            {
                id: 5,
                title: "Japón clásico y la considerada \"primera novela\"",
                period: "s. XI",
                description: "Creación del género narrativo extenso centrado en la psicología de los personajes.\nObra clave: El romance de Genji (Genji Monogatari) de Murasaki Shikibu."
            },
            {
                id: 6,
                title: "Surgimiento de las lenguas vernáculas en la Edad Media",
                period: "s. V – XV",
                description: "Los textos pasan del latín a las lenguas locales europeas mediante cantares de gesta.\nHitos: El Cantar de mio Cid y La Divina Comedia de Dante Alighieri."
            },
            {
                id: 7,
                title: "Invención de la imprenta de tipos móviles",
                period: "1440",
                description: "Johannes Gutenberg democratiza la producción de libros.\nMultiplica la alfabetización, abarata costes y cataliza el Renacimiento."
            },
            {
                id: 8,
                title: "Nacimiento de la novela moderna y el Siglo de Oro",
                period: "s. XVI – XVII",
                description: "Desarrollo del humanismo y consolidación de la novela como género dominante.\nHitos: Don Quijote de la Mancha (1605) de Miguel de Cervantes y la obra dramática de William Shakespeare."
            },
            {
                id: 9,
                title: "La Ilustración y la literatura de ideas",
                period: "s. XVIII",
                description: "La literatura adopta un fin pedagógico, crítico y filosófico.\nÉxito del ensayo y desarrollo del enciclopedismo (Voltaire, Rousseau, Montesquieu)."
            },
            {
                id: 10,
                title: "Romanticismo y Realismo",
                period: "s. XIX",
                description: "Romanticismo: Prioriza la emoción, el individualismo y la libertad creativa (Goethe, Mary Shelley, Poe).\nRealismo/Naturalismo: Retrata de forma objetiva los problemas sociales de la industrialización (Dickens, Dostoyevski, Balzac, Galdós)."
            },
            {
                id: 11,
                title: "Las Vanguardias y el Modernismo",
                period: "Principios del s. XX",
                description: "Ruptura radical con la estructura narrativa tradicional e invención de técnicas como el monólogo interior.\nAutores clave: James Joyce, Franz Kafka, Virginia Woolf y Marcel Proust."
            },
            {
                id: 12,
                title: "El \"Boom\" Latinoamericano",
                period: "1960 – 1970",
                description: "Proyección internacional de la literatura hispanoamericana e consolidación del realismo mágico.\nAutores clave: Gabriel García Márquez, Julio Cortázar, Mario Vargas Llosa y Jorge Luis Borges."
            },
            {
                id: 13,
                title: "Era Digital y Literatura Transmedia",
                period: "s. XXI",
                description: "Digitalización, autoedición masiva, libros electrónicos y narrativas hipertextuales o colaborativas en red."
            }
        ];

        // Estado de la aplicación
        let currentMilestoneIndex = 0;
        let lastFocusedElement = null;

        // Elementos DOM
        const trackContainer = document.getElementById('timeline-track');
        const scrollWrapper = document.getElementById('timeline-container');
        const modal = document.getElementById('milestone-modal');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        
        // Elementos de contenido del modal
        const modalCounter = document.getElementById('modal-counter');
        const modalPeriod = document.getElementById('modal-period');
        const modalTitle = document.getElementById('modal-title');
        const modalDescription = document.getElementById('modal-description');
        const modalProgressBar = document.getElementById('modal-progress-bar');

        // Configuración
        const btnSettings = document.getElementById('btn-settings');
        const settingsPanel = document.getElementById('settings-panel');
        const themeBtns = document.querySelectorAll('.theme-toggle-btn');

        // Inicializar iconos de Lucide
        lucide.createIcons();

        function renderTimeline() {
            hitos.forEach((hito, index) => {
                const item = document.createElement('div');
                item.className = 'timeline-item';
                item.setAttribute('role', 'listitem');
                
                // Formatear el HTML interno
                item.innerHTML = `
                    <button class="timeline-marker" aria-label="Abrir hito ${hito.id}: ${hito.title}" data-index="${index}">
                        ${hito.id}
                    </button>
                    <div class="timeline-content" aria-hidden="true">
                        <span class="block text-accent text-xs font-bold mb-1">${hito.period}</span>
                        <h3 class="font-serif text-sm sm:text-base leading-tight font-semibold text-theme">${hito.title}</h3>
                    </div>
                `;
                trackContainer.appendChild(item);
            });

            // Añadir listeners a los marcadores
            const markers = document.querySelectorAll('.timeline-marker');
            markers.forEach(marker => {
                marker.addEventListener('click', (e) => {
                    const index = parseInt(e.currentTarget.getAttribute('data-index'));
                    openModal(index);
                });
            });
        }

        function updateMarkersState() {
            const markers = document.querySelectorAll('.timeline-marker');
            markers.forEach((marker, index) => {
                if (index === currentMilestoneIndex) {
                    marker.classList.add('active');
                } else {
                    marker.classList.remove('active');
                }
            });
        }

        function openModal(index) {
            lastFocusedElement = document.activeElement;
            currentMilestoneIndex = index;
            populateModalData();
            
            // Mostrar modal
            modal.classList.add('active');
            modal.setAttribute('aria-hidden', 'false');
            
            // Actualizar marcadores
            updateMarkersState();
            
            // Gestionar foco por accesibilidad
            setTimeout(() => {
                btnCloseModal.focus();
            }, 100);

            // Evitar scroll del body
            document.body.style.overflow = 'hidden';
            
            // Centrar el scroll en la línea de tiempo hacia el elemento seleccionado
            scrollToMarker(index);
        }

        function closeModal() {
            modal.classList.remove('active');
            modal.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
            
            // Restaurar foco
            if (lastFocusedElement) {
                lastFocusedElement.focus();
            }
        }

        function populateModalData() {
            const hito = hitos[currentMilestoneIndex];
            
            modalCounter.textContent = `Hito ${currentMilestoneIndex + 1} de ${hitos.length}`;
            modalPeriod.textContent = hito.period;
            modalTitle.textContent = hito.title;
            
            // Formatear descripción (separar por saltos de línea sin alterar el texto)
            const paragraphs = hito.description.split('\n').map(p => p.trim()).filter(p => p.length > 0);
            modalDescription.innerHTML = paragraphs.map(p => `<p>${p}</p>`).join('');
            
            // Actualizar botones de navegación
            btnPrev.disabled = currentMilestoneIndex === 0;
            btnNext.disabled = currentMilestoneIndex === hitos.length - 1;
            
            // Actualizar barra de progreso
            const progress = ((currentMilestoneIndex + 1) / hitos.length) * 100;
            modalProgressBar.style.width = `${progress}%`;
        }

        function navigate(direction) {
            let newIndex = currentMilestoneIndex + direction;
            if (newIndex >= 0 && newIndex < hitos.length) {
                currentMilestoneIndex = newIndex;
                populateModalData();
                updateMarkersState();
                scrollToMarker(currentMilestoneIndex);
            }
        }

        function scrollToMarker(index) {
            const markers = document.querySelectorAll('.timeline-marker');
            if (markers[index]) {
                const marker = markers[index];
                const containerRect = scrollWrapper.getBoundingClientRect();
                const markerRect = marker.getBoundingClientRect();
                
                // Solo auto-scrolear en escritorio (horizontal)
                if (window.innerWidth > 768) {
                    const scrollLeft = marker.offsetLeft - (containerRect.width / 2) + (markerRect.width / 2);
                    scrollWrapper.scrollTo({ left: scrollLeft, behavior: 'smooth' });
                }
            }
        }

        // Gestión del Tema
        function initTheme() {
            // Intentar recuperar de localStorage, si falla usar light
            let savedTheme = 'light';
            try {
                if (localStorage.getItem('theme')) {
                    savedTheme = localStorage.getItem('theme');
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    savedTheme = 'dark';
                }
            } catch (e) {
                console.warn('localStorage no disponible');
            }
            applyTheme(savedTheme);
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            try {
                localStorage.setItem('theme', theme);
            } catch (e) {}

            // Actualizar interfaz del panel
            themeBtns.forEach(btn => {
                const isActive = btn.getAttribute('data-set-theme') === theme;
                btn.setAttribute('aria-pressed', isActive.toString());
                const icon = btn.querySelector('.check-icon');
                if (isActive) {
                    icon.classList.remove('opacity-0');
                } else {
                    icon.classList.add('opacity-0');
                }
            });
        }

        // Eventos de configuración
        btnSettings.addEventListener('click', (e) => {
            e.stopPropagation();
            const isExpanded = btnSettings.getAttribute('aria-expanded') === 'true';
            btnSettings.setAttribute('aria-expanded', !isExpanded);
            settingsPanel.classList.toggle('show');
        });

        document.addEventListener('click', (e) => {
            if (!settingsPanel.contains(e.target) && !btnSettings.contains(e.target)) {
                settingsPanel.classList.remove('show');
                btnSettings.setAttribute('aria-expanded', 'false');
            }
        });

        themeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                applyTheme(btn.getAttribute('data-set-theme'));
                settingsPanel.classList.remove('show');
                btnSettings.setAttribute('aria-expanded', 'false');
            });
        });

        // Eventos del Modal
        btnCloseModal.addEventListener('click', closeModal);
        
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        btnPrev.addEventListener('click', () => navigate(-1));
        btnNext.addEventListener('click', () => navigate(1));

        // Navegación por teclado
        document.addEventListener('keydown', (e) => {
            if (modal.classList.contains('active')) {
                if (e.key === 'Escape') closeModal();
                if (e.key === 'ArrowLeft') navigate(-1);
                if (e.key === 'ArrowRight') navigate(1);
                
                // Trampa de foco básica para el modal
                if (e.key === 'Tab') {
                    const focusable = modal.querySelectorAll('button:not([disabled])');
                    const first = focusable[0];
                    const last = focusable[focusable.length - 1];
                    
                    if (e.shiftKey && document.activeElement === first) {
                        e.preventDefault();
                        last.focus();
                    } else if (!e.shiftKey && document.activeElement === last) {
                        e.preventDefault();
                        first.focus();
                    }
                }
            }
        });

        // Inicialización
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            renderTimeline();
            
            // Opcional: centrar al inicio
            setTimeout(() => {
                scrollWrapper.scrollLeft = 0;
            }, 100);
        });

    </script>
</body>
</html>
